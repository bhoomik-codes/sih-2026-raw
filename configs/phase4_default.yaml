# Phase 4 — Risk + Incident Engine Configuration
# Camera: 960x720 border surveillance footage

camera:
  source: "data/videos/border_crossing_test.mp4"
  name: "BOP-CAM-01"
  max_queue_size: 2
  reconnect_delay_s: 3.0

detector:
  model: "models/pytorch/yolov8n.pt"
  device: "cuda:0"
  conf_threshold: 0.25
  iou_threshold: 0.45
  imgsz: 960
  inference_every_n_frames: 3
  half: false
  verbose: false

preprocessing:
  resize: [960, 960]
  roi_polygon: null

tracker:
  type: "bytetrack"
  track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8
  min_hits: 2
  max_trajectory_len: 30

event_engine:
  enabled: true
  zones:
    - name: "restricted_zone"
      polygon:
        - [0,   360]
        - [960, 360]
        - [960, 720]
        - [0,   720]
      classes: ["person"]
      severity: "high"
  lines:
    - name: "border_line"
      start: [0,   350]
      end:   [960, 350]
      classes: ["person"]
      direction: "any"
      severity: "critical"
  loitering_zones:
    - name: "border_approach"
      polygon:
        - [0,   180]
        - [960, 180]
        - [960, 380]
        - [0,   380]
      threshold_s: 8.0
      classes: ["person"]
      severity: "medium"

# --- Phase 4 Additions ---
risk_engine:
  zone_entry: 30
  line_crossing: 40
  loitering: 15
  zone_exit: 0
  wrong_direction: 20

incident_engine:
  enabled: true
  escalation_threshold: 50
  cooldown_s: 10.0

output:
  display: true
  save_annotated: false
  output_video_path: null
  metrics_csv: "benchmarks/phase4_run.csv"
  metrics_print_every_n: 30
