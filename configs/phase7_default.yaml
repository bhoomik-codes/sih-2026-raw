# Phase 7 — TensorRT / ONNX Optimization Configuration
# Uses ONNX Runtime backend instead of PyTorch for inference.
# Run `python scripts/export_onnx.py` first to generate the ONNX model.

camera:
  source: "data/videos/test_video.mp4"
  name: "BOP-CAM-01"
  max_queue_size: 2
  reconnect_delay_s: 3.0

detector:
  # Phase 7: Switch from pytorch to onnx backend
  backend: "onnx"
  model: "models/onnx/yolov8n.onnx"
  device: "cuda:0"
  conf_threshold: 0.25
  iou_threshold: 0.45
  imgsz: 640
  inference_every_n_frames: 1
  half: false
  verbose: false

preprocessing:
  resize: [640, 640]
  roi_polygon: null
  low_light: false

tracker:
  type: "bytetrack"
  track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8
  min_hits: 2
  max_trajectory_len: 30

event_engine:
  enabled: true
  zones:
    - name: "restricted_zone"
      polygon:
        - [0,   360]
        - [640, 360]
        - [640, 720]
        - [0,   720]
      classes: ["person", "car", "truck"]
      severity: "high"
  lines:
    - name: "border_line"
      start: [0,   350]
      end:   [640, 350]
      classes: ["person", "car", "truck"]
      direction: "any"
      severity: "critical"
  loitering_zones:
    - name: "border_approach"
      polygon:
        - [0,   180]
        - [640, 180]
        - [640, 380]
        - [0,   380]
      threshold_s: 8.0
      classes: ["person", "car", "truck"]
      severity: "medium"
  night_activity:
    enabled: true
    night_start_hour: 20
    night_end_hour: 6
    classes: ["person"]
    severity: "high"
    cooldown_s: 30.0

risk_engine:
  zone_entry: 30
  line_crossing: 40
  loitering: 15
  zone_exit: 0
  wrong_direction: 20
  vehicle_anpr: 10
  night_movement: 20

incident_engine:
  enabled: true
  escalation_threshold: 50
  cooldown_s: 10.0

anpr_engine:
  enabled: true
  min_crop_area: 4000
  watchlist:
    - "MH12AB1234"
    - "DL01AB1111"
    - "KL99AB9999"

output:
  display: true
  save_annotated: false
  output_video_path: null
  metrics_csv: "benchmarks/phase7_run.csv"
  metrics_print_every_n: 30
