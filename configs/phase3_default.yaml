# Phase 3 — Event Engine Configuration
# Camera: 960x720 border surveillance footage

# Camera configuration
camera:
  source: "data/videos/border_crossing_test.mp4"
  name: "BOP-CAM-01"
  max_queue_size: 2
  reconnect_delay_s: 3.0

# Detector configuration
detector:
  model: "models/pytorch/yolov8n.pt"
  device: "cuda:0"
  conf_threshold: 0.25
  iou_threshold: 0.45
  imgsz: 960
  inference_every_n_frames: 3
  half: false
  verbose: false

# Preprocessing
preprocessing:
  resize: [960, 960]
  roi_polygon: null

# Tracker configuration (Phase 2 refined)
tracker:
  type: "bytetrack"
  track_thresh: 0.25         # Min detection confidence to enter tracking
  track_buffer: 30           # Frames before a lost track is removed
  match_thresh: 0.8          # IoU threshold for matching detections to tracks
  min_hits: 2                # Consecutive frames before a track is confirmed
  max_trajectory_len: 30     # Max trajectory positions stored per track

# Event Engine (Phase 3)
# Coordinates below are in pixels for the 960x720 frame.
# The video shows a person approaching from the top, crossing a fence.
event_engine:
  enabled: true

  # Polygon zones — restricted areas. Object foot-point triggers ZONE_ENTRY.
  zones:
    - name: "restricted_zone"
      polygon:
        - [0,   360]    # Bottom half of frame = restricted side of the border
        - [960, 360]
        - [960, 720]
        - [0,   720]
      classes: ["person"]
      severity: "high"

  # Virtual line crossing — the border line itself.
  lines:
    - name: "border_line"
      start: [0,   350]
      end:   [960, 350]
      classes: ["person"]
      direction: "any"     # "AB" = top→bottom only, "BA" = bottom→top, "any" = both
      severity: "critical"

  # Loitering detection zones
  loitering_zones:
    - name: "border_approach"
      polygon:
        - [0,   180]    # Upper-middle quarter — person approaching the border
        - [960, 180]
        - [960, 380]
        - [0,   380]
      threshold_s: 8.0      # Seconds before loitering fires
      classes: ["person"]
      severity: "medium"

# Output and display
output:
  display: true
  save_annotated: false
  output_video_path: null
  metrics_csv: "benchmarks/phase3_run.csv"
  metrics_print_every_n: 30
