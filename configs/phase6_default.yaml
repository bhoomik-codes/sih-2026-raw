# Phase 6 — Night-time Performance Configuration
# Adds CLAHE low-light preprocessing + night activity detection.
# Based on Phase 5 config with night-mode additions.

camera:
  source: "data/videos/test_video.mp4"
  name: "BOP-CAM-01"
  max_queue_size: 2
  reconnect_delay_s: 3.0

detector:
  model: "models/pytorch/yolov8n.pt"
  device: "cuda:0"
  conf_threshold: 0.15
  iou_threshold: 0.45
  imgsz: 960
  inference_every_n_frames: 1
  half: false
  verbose: false

preprocessing:
  resize: [960, 960]
  roi_polygon: null
  # Phase 6: Enable CLAHE low-light enhancement
  low_light: true
  clahe_clip: 2.5       # Higher clip = more aggressive contrast boost
  clahe_grid: [8, 8]

tracker:
  type: "bytetrack"
  track_thresh: 0.25
  track_buffer: 30
  match_thresh: 0.8
  min_hits: 2
  max_trajectory_len: 30

event_engine:
  enabled: true
  zones:
    - name: "restricted_zone"
      polygon:
        - [0,   360]
        - [960, 360]
        - [960, 720]
        - [0,   720]
      classes: ["person", "car", "truck"]
      severity: "high"
  lines:
    - name: "border_line"
      start: [0,   350]
      end:   [960, 350]
      classes: ["person", "car", "truck"]
      direction: "any"
      severity: "critical"
  loitering_zones:
    - name: "border_approach"
      polygon:
        - [0,   180]
        - [960, 180]
        - [960, 380]
        - [0,   380]
      threshold_s: 8.0
      classes: ["person", "car", "truck"]
      severity: "medium"
  # Phase 6: Night-time activity detection
  night_activity:
    enabled: true
    night_start_hour: 20     # 8 PM
    night_end_hour: 6        # 6 AM
    classes: ["person"]      # People moving at night = highest priority
    severity: "high"
    cooldown_s: 30.0         # 30s per-track cooldown

risk_engine:
  zone_entry: 30
  line_crossing: 40
  loitering: 15
  zone_exit: 0
  wrong_direction: 20
  vehicle_anpr: 10
  night_movement: 20        # Phase 6: Night movement adds 20 pts

incident_engine:
  enabled: true
  escalation_threshold: 50
  cooldown_s: 10.0

anpr_engine:
  enabled: true
  min_crop_area: 4000
  watchlist:
    - "MH12AB1234"
    - "DL01AB1111"
    - "KL99AB9999"

output:
  display: true
  save_annotated: false
  output_video_path: null
  metrics_csv: "benchmarks/phase6_run.csv"
  metrics_print_every_n: 30
