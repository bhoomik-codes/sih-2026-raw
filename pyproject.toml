[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ibvap"
version = "0.1.0"
description = "Intelligent Border Video Analytics Platform – SIH 2026"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pynvml>=11.5",
    "psutil>=6.0",
    "supervision>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["apps", "cv"]

[project.scripts]
ibvap-edge = "apps.edge.main:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
